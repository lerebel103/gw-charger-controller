[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ev-charger-integration"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pymodbus==3.12.1",
    "aiomqtt==2.3.0",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.115.6",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov",
    "ruff==0.8.4",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM", "A"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/version.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.hypothesis]
database_backend = "directory"
