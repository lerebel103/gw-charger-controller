[project]
name = "ev-charger-integration"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pymodbus==3.14.0",
    "aiomqtt==2.5.1",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "hypothesis==6.163.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM", "A"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/version.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.hypothesis]
database_backend = "directory"
